<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Profile - Nutrition Tracker</title>
    <style>
        :root {
            --background: #0a0015;
            --foreground: #e0d4ff;
            --card: #130825;
            --primary: #a855f7;
            --accent: #9333ea;
            --border: rgba(168, 85, 247, 0.3);
            --input-background: #1a0d2e;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: var(--background);
            color: var(--foreground);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 450px;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--input-background);
            color: var(--foreground);
            font-size: 14px;
        }

        button {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            border: none;
            cursor: pointer;
        }

        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nutrition Tracker</h1>
        <h2>Set Up Your Profile</h2>

        <form method="POST">
            <input type="number" name="height" placeholder="Height (cm)" value="{{ user.height or '' }}" required>
            <input type="number" name="weight" placeholder="Weight (kg)" value="{{ user.weight or '' }}" required>
            <input type="number" name="age" placeholder="Age" value="{{ user.age or '' }}" required>

            <select name="gender" required>
                <option value="male" {% if user.gender=='male' %}selected{% endif %}>Male</option>
                <option value="female" {% if user.gender=='female' %}selected{% endif %}>Female</option>
            </select>

            <!-- Bug 1 Fix: values now exactly match keys in calculate_calorie_goal() -->
            <select name="activity_level" required>
                <option value="sedentary" {% if user.activity_level=='sedentary' %}selected{% endif %}>Sedentary (little or no exercise)</option>
                <option value="lightly active" {% if user.activity_level=='lightly active' %}selected{% endif %}>Lightly Active (1-3 days/week)</option>
                <option value="moderately active" {% if user.activity_level=='moderately active' %}selected{% endif %}>Moderately Active (3-5 days/week)</option>
                <option value="very active" {% if user.activity_level=='very active' %}selected{% endif %}>Very Active (6-7 days/week)</option>
                <option value="extra active" {% if user.activity_level=='extra active' %}selected{% endif %}>Extra Active (athlete / physical job)</option>
            </select>

            <select name="preference" required>
                <option value="veg" {% if user.preference=='veg' %}selected{% endif %}>Vegetarian</option>
                <option value="nonveg" {% if user.preference=='nonveg' %}selected{% endif %}>Non-Vegetarian</option>
            </select>

            <!-- Goal values: 'lose' and 'gain' match the fixed calculate_calorie_goal() checks -->
            <select name="goal" required>
                <option value="maintain" {% if user.goal=='maintain' %}selected{% endif %}>Maintain Weight</option>
                <option value="lose" {% if user.goal=='lose' %}selected{% endif %}>Lose Weight (-500 kcal/day)</option>
                <option value="gain" {% if user.goal=='gain' %}selected{% endif %}>Gain Weight (+300 kcal/day)</option>
            </select>

            <button type="submit">Save & Continue</button>
        </form>
    </div>
</body>
</html>
